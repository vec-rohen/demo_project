<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Plant HMI</title>
  <meta name="theme-color" content="#242a33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plant HMI">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23394150'/%3E%3Cpath d='M3 11h2V7h2v4h2V4h2v7h2' stroke='%2378c4b4' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <script>
    try { const t = localStorage.getItem("hmi-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Plant HMI</div>
        <div class="brand-sub">Sign in to continue</div>
      </div>
    </div>
    <p class="notice" id="notice" role="status" hidden></p>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <div class="pw-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <p class="form-error" id="error" role="alert" hidden></p>
      <button class="btn primary block" id="submit">Sign in</button>
    </form>
    <p class="muted small-print">Forgotten your password? Ask an engineer to reset it.</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const notice = document.getElementById("notice");
    if (params.has("expired")) { notice.textContent = "Your session ended. Please sign in again."; notice.hidden = false; }
    if (params.has("signedout")) { notice.textContent = "You have been signed out."; notice.hidden = false; }

    const toggle = document.getElementById("pw-toggle");
    const pw = document.getElementById("password");
    toggle.onclick = () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      toggle.textContent = show ? "Hide" : "Show";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    };

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const error = document.getElementById("error");
      const submit = document.getElementById("submit");
      const username = document.getElementById("username").value.trim();
      if (!username || !pw.value) {
        error.textContent = "Enter your username and password.";
        error.hidden = false;
        return;
      }
      submit.disabled = true;
      submit.textContent = "Signing in…";
      error.hidden = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password: pw.value }),
        });
        if (res.ok) { location.replace("/"); return; }
        const data = await res.json().catch(() => ({}));
        error.textContent = data.detail || `Sign-in failed (${res.status})`;
      } catch {
        error.textContent = "Can't reach the HMI server. Check the network connection.";
      }
      error.hidden = false;
      pw.value = "";
      pw.focus();
      submit.disabled = false;
      submit.textContent = "Sign in";
    });
  </script>
</body>
</html>
